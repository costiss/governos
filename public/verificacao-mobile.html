<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>República — verificação mobile</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
        display: flex;
        gap: 20px;
        padding: 20px;
        font: 12px ui-monospace, monospace;
        color: #8f8f8f;
      }
      figure {
        margin: 0;
        flex: 0 0 auto;
      }
      figcaption {
        padding: 0 0 8px;
      }
      iframe {
        border: 1px solid #2b2b2b;
        background: #0a0a0a;
        display: block;
      }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>390 × 2600 — visão geral</figcaption>
      <iframe src="/#/geral" width="390" height="2600"></iframe>
    </figure>
    <figure>
      <figcaption>390 × 2600 — comparar</figcaption>
      <iframe src="/#/comparar" width="390" height="2600"></iframe>
    </figure>
    <figure>
      <figcaption>390 × 2000 — mapa</figcaption>
      <iframe src="/#/mapa" width="390" height="2000"></iframe>
    </figure>
  </body>
</html>
