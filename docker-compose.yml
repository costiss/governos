services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: republica:latest
    container_name: republica
    restart: unless-stopped
    ports:
      # Só o host local por padrão. Para expor na rede, troque por "8080:8080"
      # — ou deixe o proxy reverso cuidar disso e remova o mapeamento.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
