# Configuração do nginx para servir o SPA estático.
#
# Substitui a configuração padrão inteira de propósito: o processo roda como
# usuário `nginx` (sem privilégios), então tudo que o nginx precisa escrever na
# partida — pid e diretórios temporários — vai para /tmp.

pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  charset       utf-8;

  # O nginx precisa destes diretórios e, sem root, não pode usar /var/lib/nginx.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # `docker logs` recebe as duas saídas.
  # Sem texto colado à variável: `$request_times` seria lido como um nome só.
  log_format principal '$remote_addr "$request" $status $request_time';
  access_log /dev/stdout principal;
  error_log  /dev/stderr warn;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  keepalive_timeout 65;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_comp_level   6;
  gzip_proxied      any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # ── Cabeçalhos de segurança ──────────────────────────────────────────────
    # Declarados NO NÍVEL DO SERVIDOR: o nginx só os herda nas rotas que não
    # declaram `add_header` próprio. Por isso as rotas abaixo usam `expires`
    # (que não é add_header) em vez de definir Cache-Control à mão — assim elas
    # continuam herdando tudo isto.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # O app fala DIRETO com as APIs oficiais — não há backend nem proxy. As
    # origens em `connect-src` são exatamente as três que a aplicação consulta,
    # e nada além disso:
    #
    #   apisidra.ibge.gov.br  IBGE/SIDRA   (preços, população, PIB)
    #   www.ipeadata.gov.br   Ipea Data    (trabalho, social, saúde, educação, violência)
    #   api.bcb.gov.br        Banco Central (juros, câmbio, dívida, reservas)
    #
    # O INPE/PRODES NÃO aparece aqui: a série de desmatamento vem de snapshot
    # embarcado no build, porque o TerraBrasilis não envia CORS.
    #
    # `style-src` precisa de 'unsafe-inline': o evilcharts injeta um <style> com
    # as variáveis de cor dos gráficos. `img-src` precisa de blob: e data: pelos
    # preenchimentos de textura que o ECharts desenha em canvas.
    #
    # Nota: o nginx não sabe montar uma diretiva a partir de várias linhas, então
    # a política fica numa linha só de propósito.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://apisidra.ibge.gov.br https://www.ipeadata.gov.br https://api.bcb.gov.br; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # O HTML nunca deve ser cacheado: ele aponta para os assets com hash, e uma
    # versão velha do HTML prenderia o visitante numa build antiga.
    # (`expires -1` emite Cache-Control: no-cache.)
    expires -1;

    # Assets com hash no nome: imutáveis. Se o conteúdo muda, o nome muda.
    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }

    # SPA: qualquer caminho desconhecido devolve o index.
    # O app usa rota por hash (#/geral), então na prática quase tudo cai na raiz;
    # a regra existe para não devolver 404 em caminhos futuros.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
