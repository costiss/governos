server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Assets têm hash no nome: se o conteúdo muda, o nome muda. Podem ser
  # cacheados para sempre — e é o que faz o app abrir instantâneo na revisita.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Todo o resto cai no index, que nunca é cacheado (é ele que aponta para os
  # assets com hash). O app usa rota por hash (#/geral), então na prática quase
  # tudo já cai aqui naturalmente.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
